<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videha Combined Thesaurus + WordNet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Videha Combined Thesaurus + WordNet</h1>
    <p>English-Maithili and Maithili-English base thesaurus with rebuilt WordNet 2.1 senses and relations.</p>
  </header>
  <main>
    <section class="controls">
      <select id="volume">
        <option value="em">English-Maithili + WordNet</option>
        <option value="me">Maithili-English + WordNet</option>
      </select>
      <input id="q" type="search" placeholder="Search word or meaning..." autocomplete="off">
      <button id="search">Search</button>
      <button id="clear">Clear</button>
      <label><input type="checkbox" id="deep"> Deep search all chunks</label>
      <span id="status">Loading manifest...</span>
    </section>
    <section id="results"></section>
  </main>
  <script src="app.js?v=mobile-20260707-1"></script>
</body>
</html>
